[package]
name = "findmore-vpn"
version = "1.0.0"
description = "Findmore VPN Client"
edition = "2021"
default-run = "findmore-vpn-gui"

[lib]
name = "findmore_vpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "findmore-vpn-gui"
path = "src/main.rs"

[[bin]]
name = "findmore-vpn-helper"
path = "src/helper.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
keyring = { version = "3.2.1", default-features = false, features = ["linux-native"] }
